<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThreatScope SOC | Advanced Demo</title>
  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="navbar-brand">
      <div class="brand-logo">TS</div>
      <div class="brand-title">
        <h1>ThreatScope</h1>
        <span class="brand-tagline">AI SECURITY OPERATIONS CENTER</span>
      </div>
    </div>
    <nav class="navbar-status" id="navStatus" style="display: flex; gap: 20px; align-items: center;">
      <div class="status-item" id="statusPipeline" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-secondary);">
        <span class="status-dot dot-error" style="width: 8px; height: 8px; border-radius: 50%; background: var(--sev-critical);"></span>
        <span>Pipeline</span>
      </div>
      <div class="status-item" id="statusXgb" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-secondary);">
        <span class="status-dot dot-error" style="width: 8px; height: 8px; border-radius: 50%; background: var(--sev-critical);"></span>
        <span>XGBoost</span>
      </div>
      <div class="status-item" id="statusIF" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-secondary);">
        <span class="status-dot dot-error" style="width: 8px; height: 8px; border-radius: 50%; background: var(--sev-critical);"></span>
        <span>Isolation Forest</span>
      </div>
    </nav>
  </header>

  <div class="app-container">
    <!-- LEFT NAVIGATION -->
    <nav class="app-sidebar">
      <ul class="nav-menu">
        <li><a href="#/dashboard" class="nav-item active"><span class="icon">🎯</span> Dashboard</a></li>
        <li><a href="#/scanning" class="nav-item"><span class="icon">🔍</span> Scanning</a></li>
        <li><a href="#/risk" class="nav-item"><span class="icon">📈</span> Risk Analysis</a></li>
        <li><a href="#/mitre" class="nav-item"><span class="icon">🛡️</span> MITRE ATT&CK</a></li>
        <li><a href="#/attack-chain" class="nav-item"><span class="icon">🔗</span> Attack Chain</a></li>
        <li><a href="#/recommendations" class="nav-item"><span class="icon">💡</span> Actions</a></li>
      </ul>
      <div class="nav-footer">
        <button id="btnDemoToggle" class="btn btn-primary" style="width: 100%; margin-bottom: 10px;">Start Demo</button>
        <button id="btnDemoStop" class="btn btn-danger" style="width: 100%; display: none;">Stop Demo</button>
      </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <div id="pageContainer" class="page-container">
      <!-- Pages render here -->
    </div>
  </div>

  <script src="dashboard.js"></script>
  <script src="router.js"></script>
  
  <script src="pages/dashboard.js"></script>
  <script src="pages/scanning.js"></script>
  <script src="pages/risk.js"></script>
  <script src="pages/mitre.js"></script>
  <script src="pages/attack_chain.js"></script>
  <script src="pages/recommendations.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      TS.boot();

      // Poll status and update dots
      setInterval(async () => {
        try {
          const res = await fetch('http://127.0.0.1:5000/api/status');
          if(res.ok) {
            const s = await res.json();
            const setDot = (id, ok) => {
              const el = document.querySelector(`#${id} .status-dot`);
              if (el) {
                el.style.background = ok ? 'var(--sev-low)' : 'var(--sev-critical)';
                el.style.boxShadow = ok ? '0 0 8px rgba(34,197,94,0.5)' : 'none';
              }
            };
            setDot('statusPipeline', s.pipeline_ready);
            setDot('statusXgb', s.xgb_available);
            setDot('statusIF', s.if_present);
          }
        } catch(e) {}
      }, 5000);
      
      // trigger immediate check
      fetch('http://127.0.0.1:5000/api/status').then(r=>r.json()).then(s=>{
        const setDot = (id, ok) => {
          const el = document.querySelector(`#${id} .status-dot`);
          if (el) {
            el.style.background = ok ? 'var(--sev-low)' : 'var(--sev-critical)';
            el.style.boxShadow = ok ? '0 0 8px rgba(34,197,94,0.5)' : 'none';
          }
        };
        setDot('statusPipeline', s.pipeline_ready);
        setDot('statusXgb', s.xgb_available);
        setDot('statusIF', s.if_present);
      }).catch(e=>{});
    });
  </script>
</body>
</html>
